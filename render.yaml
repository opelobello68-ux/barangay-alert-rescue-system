services:
  - type: web
    name: bars-laravel
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Barangay Alert and Rescue System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: BARS_SEED
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bars-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: bars-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: bars-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bars-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: bars-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: bars-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bars-db
          property: password

databases:
  - name: bars-db
    plan: free
    region: singapore
    databaseName: bars
    user: bars_user
